name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main", "stable"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_SECRET }}
          user: mantreshkhurana
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Calcutta
          config_animations: yes

          # Languages (indepth = clone + run Linguist locally so most-used
          # actually populates instead of rendering an empty section)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Isometric contribution calendar (very visual, updates daily)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits & activity patterns
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Notable contributions in other organizations
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          # Follow-up on repositories
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories
