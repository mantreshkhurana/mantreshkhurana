name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main", "stable"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_SECRET }}
          user: mantreshkhurana
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Calcutta
          config_animations: yes

          # Render only — commit happens below after pinning the joined date
          output_action: none

          # Languages (indepth = clone + run Linguist locally so most-used
          # actually populates instead of rendering an empty section)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Isometric contribution calendar (very visual, updates daily)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Notable contributions in other organizations
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          # Follow-up on repositories
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories

      - name: Pin joined date to 7 years and commit
        run: |
          sudo mv /metrics_renders/github-metrics.svg github-metrics.svg
          sudo chown "$USER" github-metrics.svg
          sed -i -E 's/Joined GitHub [^<]+ ago/Joined GitHub 7 years ago/g' github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || git commit -m "Update github-metrics.svg - [Skip GitHub Action]"
          git push
